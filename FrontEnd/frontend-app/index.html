<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#38393b" />
    <meta name="description" content="ABISSOL V2 · Plataforma inteligente de gestión" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ABISSOL V2</title>
    <script>
      try {
        const savedTheme = localStorage.getItem("theme");
        const initialTheme = ["light", "medium", "dark", "virtualia", "lady"].includes(savedTheme)
          ? savedTheme
          : "medium";
        document.documentElement.classList.add(initialTheme);
        document.documentElement.style.colorScheme = initialTheme === "dark" || initialTheme === "virtualia" ? "dark" : "light";
        localStorage.setItem("theme", initialTheme);
      } catch {
        document.documentElement.classList.add("medium");
      }
    </script>
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      .app-loading {
        box-sizing: border-box;
        display: flex;
        min-height: 100vh;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        background: #fff;
        color: #52525b;
        color-scheme: light;
        font: 400 14px/1.5 system-ui, sans-serif;
      }
      .app-loading-spinner {
        box-sizing: border-box;
        width: 20px;
        height: 20px;
        flex: none;
        border: 2px solid #e4e4e7;
        border-top-color: #71717a;
        border-radius: 50%;
        animation: app-loading-spin 0.8s linear infinite;
      }
      @keyframes app-loading-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .app-loading-spinner { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading" role="status" aria-live="polite">
        <span class="app-loading-spinner" aria-hidden="true"></span>
        <span>Cargando</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
